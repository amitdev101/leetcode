services:
  searxng:
    image: searxng/searxng:latest
    container_name: local-searxng

    ports:
      # Local machine only.
      # Change 127.0.0.1 to 0.0.0.0 only when other LAN machines need access.
      - "127.0.0.1:8080:8080"

    volumes:
      - ./searxng:/etc/searxng

    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETGID
      - SETUID

